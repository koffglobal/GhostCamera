name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode runer
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-runer: latest-stable

    - name: Build app
      run: |
        cd GhostCamera
        xcodebuild -project GhostCamera.xcodeproj \
          -scheme GhostCamera \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath build/GhostCamera.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        cd GhostCamera
        xcodebuild -exportArchive \
          -archivePath build/GhostCamera.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist ExportOptions.plist

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: GhostCamera-IPA
        path: GhostCamera/build/*.ipa
